<!doctype html>
<html lang="hr">
<head>

<style>
:root{--bg:#000;--panel:#111;--panel2:#1c1c1e;--panel3:#252528;--line:#2c2c2e;--text:#fff;--muted:#8e8e93;--red:#ff453a;--blue:#0a84ff;--green:#30d158;--shadow:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}
.screen{max-width:620px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;letter-spacing:.5px;font-size:18px}.brand span{color:var(--red)}.topactions{display:flex;gap:8px}.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:var(--panel2);color:#fff;font-size:18px}.year{color:var(--red);font-size:17px;font-weight:700;margin-top:10px}.monthrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.month{font-size:36px;font-weight:800;line-height:1;margin:4px 0 10px}.monthnav{display:flex;gap:8px}.monthnav button{width:42px;height:42px;border:0;border-radius:50%;background:var(--panel2);color:#fff;font-size:26px}.sub{font-size:12px;color:var(--muted);margin:2px 0 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.pill{border:1px solid #333;border-radius:999px;background:#171719;color:#ddd;padding:7px 11px;font-size:12px}.pill.active{background:#25314a;border-color:#355185;color:#fff}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:7px 0}.day{min-height:88px;border-top:1px solid var(--line);padding:5px 2px;overflow:hidden;position:relative}.day.today .daynum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff}.daynum{font-size:14px;margin:0 2px 4px}.event{font-size:10px;line-height:1.15;padding:4px 5px;border-radius:6px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(255,255,255,.08)}.fab{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:36px;box-shadow:var(--shadow)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:30}.sheet.show{display:flex}.card{width:min(100%,620px);margin:auto;background:#151515;height:min(95dvh,95vh);max-height:min(95dvh,95vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:24px 24px 0 0;padding:10px 16px calc(120px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.handle{width:44px;height:5px;border-radius:999px;background:#555;margin:3px auto 12px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-10px;z-index:12;background:#151515;padding:10px 0}.cardhead h2{margin:0;font-size:23px}.linkbtn{border:0;background:none;color:var(--blue);padding:8px 0;font-size:16px}.save{color:var(--red);font-weight:800}.formgroup{background:var(--panel2);border-radius:16px;padding:0 14px;margin:12px 0;overflow:hidden}.field{border-bottom:1px solid #303033;padding:13px 0}.field:last-child{border-bottom:0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;color:#fff;background:transparent;border:0;outline:0;font-size:17px}.field textarea{min-height:60px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.passenger{background:var(--panel2);border-radius:16px;padding:10px 14px;margin:12px 0}.passhead{display:flex;justify-content:space-between;align-items:center}.removePassenger{border:0;background:none;color:#ff6961;font-size:13px}.addbtn{width:100%;padding:14px;border:1px solid #3a3a3c;border-radius:14px;background:#202022;color:var(--blue);margin:10px 0;font-size:17px}.actionrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px;padding:0}.maps,.senddriver,.secondary,.dangerbtn{width:100%;padding:14px;border:0;border-radius:14px;color:#fff;font-weight:800}.maps{background:var(--blue)}.senddriver{background:var(--red)}.secondary{background:var(--panel3)}.dangerbtn{background:#491b1b;color:#ff8b84}
.auth{min-height:100vh;display:grid;place-items:center;padding:25px}.authbox{width:min(100%,430px);background:#111;border:1px solid #222;border-radius:24px;padding:24px}.logo{font-size:30px;font-weight:900;margin-bottom:8px}.logo span{color:var(--red)}.authbox p{color:#aaa;line-height:1.4}.authbox input{width:100%;background:var(--panel2);color:#fff;border:1px solid #333;border-radius:12px;padding:14px;margin:8px 0}.primary{width:100%;border:0;border-radius:13px;background:var(--red);color:#fff;font-weight:800;padding:14px;margin-top:8px}.msg{font-size:13px;color:#aaa;margin-top:12px;min-height:18px}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.statuschip{border:1px solid #3a3a3c;border-radius:999px;background:#202022;color:#ddd;padding:8px 11px;font-size:12px}
.statuschip.active{outline:2px solid rgba(255,255,255,.18)}
.status-assigned{background:#3a3a3c!important}.status-accepted{background:#0a84ff!important}.status-started{background:#ff9f0a!important}.status-completed{background:#30d158!important}.status-cancelled{background:#7a1f1f!important}
.event.status-accepted{box-shadow:inset 0 0 0 2px rgba(10,132,255,.8)}
.event.status-started{box-shadow:inset 0 0 0 2px rgba(255,159,10,.95)}
.event.status-completed{opacity:.62}
.event.status-cancelled{opacity:.45;text-decoration:line-through}

.statusline{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.statusdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.s-assigned{background:#8e8e93}.s-accepted{background:#0a84ff}.s-started{background:#ff9f0a}.s-completed{background:#30d158}.s-cancelled{background:#ff453a}
.driveraction{width:100%;padding:15px;border:0;border-radius:14px;font-weight:850;color:#fff;margin-top:10px}
.driver-accept{background:#0a84ff}.driver-start{background:#ff9f0a}.driver-complete{background:#30d158}.driver-cancel{background:#7a1f1f}
.event{border-left:4px solid transparent}
.event.st-assigned{border-left-color:#8e8e93}.event.st-accepted{border-left-color:#0a84ff}.event.st-started{border-left-color:#ff9f0a}.event.st-completed{border-left-color:#30d158;opacity:.68}.event.st-cancelled{border-left-color:#ff453a;opacity:.48;text-decoration:line-through}
.detailblock{background:var(--panel2);border-radius:14px;padding:14px;margin:10px 0}.detailblock b{display:block;margin-bottom:5px}.detailblock .small{line-height:1.5}.detailactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.adminpanel{padding:14px 0}.sectiontitle{font-size:22px;font-weight:800;margin:12px 0}.driverrow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel2);border-radius:13px;padding:12px;margin:8px 0}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#2c2c2e;color:#bbb}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#242426;color:#fff;border:1px solid #333;border-radius:999px;padding:10px 14px;z-index:99;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){.month{font-size:34px}.day{min-height:82px}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="authbox"><div class="logo">AM <span>TRANSFER</span></div><p>Prijava za administraciju i vozače.</p><input id="email" type="email" placeholder="ime@email.com" autocomplete="email"><input id="password" type="password" placeholder="Lozinka" autocomplete="current-password"><button id="passwordLoginBtn" class="primary">Prijava</button><button id="resetBtn" class="primary" style="background:#1c1c1e;border:1px solid #333">Postavi / zaboravljena lozinka</button><button id="loginBtn" class="primary" style="background:transparent;border:0;color:#8e8e93;font-size:14px">Jednokratni link</button><div id="authMsg" class="msg"></div></div></div>
<div id="app" class="screen hidden"><div class="top"><div class="brand">AM <span>TRANSFER</span></div><div class="topactions"><button id="todayBtn" class="iconbtn" title="Danas">●</button><button id="setPasswordBtn" class="iconbtn" title="Postavi lozinku">🔑</button><button id="adminBtn" class="iconbtn hidden" title="Vozači">👥</button><button id="logoutBtn" class="iconbtn" title="Odjava">↪</button></div></div><div class="year" id="yearLabel"></div><div class="monthrow"><div class="month" id="monthLabel"></div><div class="monthnav"><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div><div class="sub" id="who"></div><div class="toolbar"><button id="filterAll" class="pill active">Sve vožnje</button><button id="filterAssigned" class="pill">S vozačem</button><button id="filterUnassigned" class="pill">Bez vozača</button></div><div class="weekdays"><div>PON</div><div>UTO</div><div>SRI</div><div>ČET</div><div>PET</div><div>SUB</div><div>NED</div></div><div class="grid" id="grid"></div><button id="fab" class="fab hidden">＋</button></div>
<div class="sheet" id="rideSheet"><div class="card"><div class="handle"></div><div class="cardhead"><button id="rideCancel" class="linkbtn">Odustani</button><h2 id="rideTitle">Nova vožnja</h2><button id="rideSave" class="linkbtn save">Spremi</button></div><div class="formgroup"><div class="row"><div class="field"><label>📅 Datum</label><input id="rideDate" type="date"></div><div class="field"><label>🕘 Vrijeme</label><input id="rideTime" type="time"></div></div></div><div id="passengers"></div><button id="addPassenger" class="addbtn">＋ Dodaj putnika / PICK UP</button><div class="formgroup"><div class="field"><label>⬇ DROP OFF</label><input id="dropoff" placeholder="Adresa ili hotel"></div><div class="field"><label>🚘 Auto</label>
<input id="vehicleName" list="vehicleOptions" placeholder="Upiši naziv automobila, npr. Mercedes E class">
<datalist id="vehicleOptions"></datalist>
</div><div class="field"><label>👤 Vozač</label><select id="driver"></select></div><div class="field"><label>🏢 Naručitelj prijevoza</label><select id="client"></select></div></div><div class="formgroup"><div class="field"><label>📌 Status</label><select id="status"><option value="assigned">Dodijeljena / nova</option><option value="accepted">Prihvaćena</option><option value="started">U tijeku</option><option value="completed">Završena</option><option value="cancelled">Otkazana</option></select></div></div><div class="formgroup"><div class="row"><div class="field"><label>💶 Cijena (€)</label><input id="price" type="number" min="0" step="0.01"></div><div class="field"><label>💳 Plaćanje</label><input id="payment" placeholder="keš / kartica"></div></div><div class="field"><label>📝 Napomena</label><textarea id="note" placeholder="Dodaj napomenu (opcionalno)"></textarea></div></div><div class="actionrow"><button id="mapsBtn" class="maps">🧭 Navigacija</button><button id="sendDriverBtn" class="senddriver">📲 Pošalji vozaču</button></div></div></div>
<div class="sheet" id="detailSheet"><div class="card"><div class="handle"></div><div class="cardhead"><button id="detailClose" class="linkbtn">Zatvori</button><h2>Detalji vožnje</h2><button id="detailEdit" class="linkbtn save hidden">Uredi</button></div><div id="detailContent"></div></div></div>
<div class="sheet" id="adminSheet"><div class="card"><div class="handle"></div><div class="cardhead"><button id="adminClose" class="linkbtn">Zatvori</button><h2>Vozači</h2><span></span></div><div class="adminpanel"><div class="small">Za internu evidenciju dovoljan je samo naziv vozača. E-mail je opcionalan i koristi se ako mu kasnije želiš omogućiti prijavu.</div><div class="formgroup"><div class="field"><label>Ime vozača</label><input id="newDriverName" placeholder="npr. Dino"></div><div class="field"><label>E-mail vozača (opcionalno)</label><input id="newDriverEmail" type="email" placeholder="vozac@email.com"></div></div><button id="addDriver" class="primary">+ Dodaj vozača</button><div class="sectiontitle">Odobreni korisnici</div><div id="allowedList"></div></div></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://vlytdhtxnpbsbctzqoen.supabase.co','sb_publishable_9bWxM2LAG1Em6gcZxiglkA_vwvr9yh1');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let session=null,profile=null,rides=[],clients=[],vehicles=[],drivers=[],driverDirectory=[],editingRide=null,currentFilter='all';
const monthNames=['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];const today=new Date();let viewDate=new Date(today.getFullYear(),today.getMonth(),1);
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function isoDate(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function fmtDateHr(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}.${m}.${y}.`}
const statusLabels={assigned:'Dodijeljena',accepted:'Prihvaćena',started:'U tijeku',completed:'Završena',cancelled:'Otkazana'};
function statusLabel(s){return statusLabels[s]||'Dodijeljena'}
function statusClass(s){return 'st-'+(s||'assigned')}
function statusDotClass(s){return 's-'+(s||'assigned')}
function isAdmin(){return profile?.role==='admin'}function selectedText(id){return $(id).selectedOptions?.[0]?.textContent||''}
function selectedVehicleData(){
 const name=($('vehicleName')?.value||'').trim();
 const v=vehicles.find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());
 return {vehicle_id:v?.id||null,vehicle_name:name||null};
}
function selectedDriverData(){
 const v=$('driver').value||'';
 if(v.startsWith('profile:')){
   const id=v.slice(8),d=drivers.find(x=>x.id===id);
   return {driver_id:id,driver_name:d?.full_name||null,type:'profile'};
 }
 if(v.startsWith('manual:')){
   const id=v.slice(7),d=driverDirectory.find(x=>x.id===id);
   return {driver_id:null,driver_name:d?.name||selectedText('driver'),type:'manual'};
 }
 return {driver_id:null,driver_name:null,type:null};
}
function setDriverSelectFromRide(r){
 if(r.driver_id){$('driver').value='profile:'+r.driver_id;return;}
 if(r.driver_name){
   const d=driverDirectory.find(x=>x.name===r.driver_name);
   if(d){$('driver').value='manual:'+d.id;return;}
 }
 $('driver').value='';
}
$('passwordLoginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authMsg').textContent='Upiši e-mail i lozinku.';return}$('authMsg').textContent='Prijavljujem...';const{error}=await supabase.auth.signInWithPassword({email,password});$('authMsg').textContent=error?'Greška: '+error.message:''};
$('resetBtn').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authMsg').textContent='Upiši e-mail.';return}const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/?recovery=1'});$('authMsg').textContent=error?'Greška: '+error.message:'Poslan je e-mail. Otvori najnoviji link.'};
$('loginBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return;const{error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/?auth=1',shouldCreateUser:false}});$('authMsg').textContent=error?'Greška: '+error.message:'Provjeri e-mail i otvori najnoviji link.'};
$('logoutBtn').onclick=()=>supabase.auth.signOut();supabase.auth.onAuthStateChange(async(e,s)=>{session=s;await boot();if(e==='PASSWORD_RECOVERY'&&s)setTimeout(()=>$('setPasswordBtn').click(),300)});
if(location.hash.includes('access_token=')){const h=new URLSearchParams(location.hash.slice(1)),at=h.get('access_token'),rt=h.get('refresh_token');if(at&&rt){await supabase.auth.setSession({access_token:at,refresh_token:rt});history.replaceState({},'',location.pathname)}}
await new Promise(r=>setTimeout(r,200));session=(await supabase.auth.getSession()).data.session;await boot();
async function boot(){if(!session){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}const{data:p,error}=await supabase.from('profiles').select('*').eq('id',session.user.id).single();if(error){$('authMsg').textContent=error.message;return}profile=p;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${profile.full_name||session.user.email} · ${isAdmin()?'Administrator':'Vozač'}`;$('fab').classList.toggle('hidden',!isAdmin());$('adminBtn').classList.toggle('hidden',!isAdmin());$('detailEdit').classList.toggle('hidden',!isAdmin());
if(!isAdmin()){$('filterAll').textContent='Moje vožnje';$('filterAssigned').textContent='Aktivne';$('filterUnassigned').textContent='Završene';}
await loadData();renderCalendar()}
async function loadData(){const y=viewDate.getFullYear(),m=viewDate.getMonth(),first=isoDate(y,m,1),last=isoDate(y,m,new Date(y,m+1,0).getDate());const[cr,vr,pr,dr,rr]=await Promise.all([
 supabase.from('clients').select('*').order('name'),
 supabase.from('vehicles').select('*').eq('active',true).order('name'),
 supabase.from('profiles').select('*').eq('role','driver').order('full_name'),
 supabase.from('driver_directory').select('*').eq('active',true).order('name'),
 supabase.from('rides').select('*,client:clients(*),vehicle:vehicles(*),driver:profiles!rides_driver_id_fkey(*),passengers(*),stops(*)').gte('ride_date',first).lte('ride_date',last).order('ride_date').order('ride_time')
]);clients=cr.data||[];vehicles=vr.data||[];drivers=pr.data||[];driverDirectory=dr.data||[];rides=rr.data||[];if(!isAdmin())rides=rides.filter(r=>r.driver_id===profile.id);fillSelects()}
function fillSelects(){$('client').innerHTML='<option value="">— Bez naručitelja —</option>'+clients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('vehicleOptions').innerHTML=vehicles.map(x=>`<option value="${esc(x.name)}"></option>`).join('');$('driver').innerHTML='<option value="">— Bez vozača —</option>'+
  drivers.map(x=>`<option value="profile:${x.id}">${esc(x.full_name||'Vozač')}</option>`).join('')+
  driverDirectory.map(x=>`<option value="manual:${x.id}">${esc(x.name)}${x.email?' · '+esc(x.email):' · evidencija'}</option>`).join('')}
function filteredRides(){
 if(!isAdmin()){
   if(currentFilter==='assigned')return rides.filter(r=>!['completed','cancelled'].includes(r.status||'assigned'));
   if(currentFilter==='unassigned')return rides.filter(r=>(r.status||'assigned')==='completed');
   return rides;
 }
 if(currentFilter==='assigned')return rides.filter(r=>r.driver_id||r.driver_name);
 if(currentFilter==='unassigned')return rides.filter(r=>!r.driver_id&&!r.driver_name);
 return rides
}
function setFilter(v){currentFilter=v;$('filterAll').classList.toggle('active',v==='all');$('filterAssigned').classList.toggle('active',v==='assigned');$('filterUnassigned').classList.toggle('active',v==='unassigned');renderCalendar()}$('filterAll').onclick=()=>setFilter('all');$('filterAssigned').onclick=()=>setFilter('assigned');$('filterUnassigned').onclick=()=>setFilter('unassigned');
function renderCalendar(){const y=viewDate.getFullYear(),m=viewDate.getMonth();$('yearLabel').textContent=y+'.';$('monthLabel').textContent=monthNames[m];const first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),visible=filteredRides();$('grid').innerHTML='';for(let i=0;i<42;i++){const cell=document.createElement('div');cell.className='day';const n=i-offset+1;if(n>=1&&n<=days){const ds=isoDate(y,m,n);if(ds===isoDate(today.getFullYear(),today.getMonth(),today.getDate()))cell.classList.add('today');cell.innerHTML=`<div class="daynum">${n}</div>`;visible.filter(r=>r.ride_date===ds).forEach(r=>{const e=document.createElement('div');e.className=`event ${statusClass(r.status)}`;e.style.background=r.client?.color||'#636366';e.textContent=`${(r.ride_time||'').slice(0,5)} ${r.passengers?.[0]?.name||'Vožnja'} · ${statusLabel(r.status)}${(r.driver?.full_name||r.driver_name)?' · '+(r.driver?.full_name||r.driver_name):''}`;e.onclick=()=>showDetail(r);cell.appendChild(e)})}$('grid').appendChild(cell)}}
$('prevMonth').onclick=async()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);await loadData();renderCalendar()};$('nextMonth').onclick=async()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);await loadData();renderCalendar()};$('todayBtn').onclick=async()=>{viewDate=new Date(today.getFullYear(),today.getMonth(),1);await loadData();renderCalendar()};
function passengerBlock(v={}){const el=document.createElement('div');el.className='passenger';el.innerHTML=`<div class="passhead"><div class="small">Putnik / PICK UP</div><button class="removePassenger">Ukloni</button></div><div class="field"><label>👤 Putnik</label><input class="pname" value="${esc(v.name||'')}" placeholder="Ime putnika"></div><div class="field"><label>📞 Broj mobitela</label><input class="pphone" value="${esc(v.phone||'')}" placeholder="+385..."></div><div class="field"><label>⬆ PICK UP</label><input class="ppickup" value="${esc(v.pickup||'')}" placeholder="Hotel / adresa"></div>`;el.querySelector('.removePassenger').onclick=()=>{if(document.querySelectorAll('.passenger').length<=1)return toast('Mora ostati barem jedan putnik.');el.remove()};$('passengers').appendChild(el)}
$('addPassenger').onclick=()=>passengerBlock();function resetRideForm(){$('passengers').innerHTML='';passengerBlock();['dropoff','price','payment','note'].forEach(id=>$(id).value='');$('driver').value='';$('client').value='';if($('vehicleName'))$('vehicleName').value='';$('status').value='assigned'}
function openNewRide(){editingRide=null;$('rideTitle').textContent='Nova vožnja';resetRideForm();$('rideDate').value=isoDate(today.getFullYear(),today.getMonth(),today.getDate());$('rideTime').value='19:00';$('rideSheet').classList.add('show')}$('fab').onclick=openNewRide;$('rideCancel').onclick=()=>{editingRide=null;$('rideSheet').classList.remove('show')};
function collectPassengers(){return[...document.querySelectorAll('.passenger')].map((el,i)=>({name:el.querySelector('.pname').value.trim(),phone:el.querySelector('.pphone').value.trim(),pickup:el.querySelector('.ppickup').value.trim(),sort:i})).filter(x=>x.name||x.pickup)}
function validateRide(){const ps=collectPassengers();if(!ps.length)return'Upiši barem jednog putnika.';if(ps.some(p=>!p.name||!p.pickup))return'Svaki putnik mora imati ime i PICK UP.';if(!$('rideDate').value)return'Odaberi datum.';if(!$('rideTime').value)return'Odaberi vrijeme.';if(!$('dropoff').value.trim())return'Upiši DROP OFF.';return''}
$('rideSave').onclick=async()=>{const invalid=validateRide();if(invalid)return alert(invalid);const ps=collectPassengers();$('rideSave').disabled=true;$('rideSave').textContent='Spremam...';const sd=selectedDriverData(),sv=selectedVehicleData();const rideData={ride_date:$('rideDate').value,ride_time:$('rideTime').value,driver_id:sd.driver_id,driver_name:sd.driver_name,client_id:$('client').value||null,vehicle_id:sv.vehicle_id,vehicle_name:sv.vehicle_name,price:$('price').value||null,payment_note:$('payment').value.trim(),note:$('note').value.trim(),status:$('status').value||'assigned'};let r,error;if(editingRide){({data:r,error}=await supabase.from('rides').update(rideData).eq('id',editingRide.id).select().single());if(!error){let de=await supabase.from('stops').delete().eq('ride_id',editingRide.id);if(de.error)error=de.error;if(!error){de=await supabase.from('passengers').delete().eq('ride_id',editingRide.id);if(de.error)error=de.error}}}else{({data:r,error}=await supabase.from('rides').insert({...rideData,created_by:session.user.id}).select().single())}if(error){alert('Greška pri spremanju: '+error.message);done();return}for(const p of ps){const{data:pp,error:pe}=await supabase.from('passengers').insert({ride_id:r.id,name:p.name,phone:p.phone,sort_order:p.sort}).select().single();if(pe){alert('Greška putnika: '+pe.message);done();return}const{error:se}=await supabase.from('stops').insert({ride_id:r.id,passenger_id:pp.id,stop_type:'pickup',address:p.pickup,sort_order:p.sort});if(se){alert('Greška PICK UP-a: '+se.message);done();return}}const{error:dropErr}=await supabase.from('stops').insert({ride_id:r.id,stop_type:'dropoff',address:$('dropoff').value.trim(),sort_order:999});if(dropErr){alert('Greška DROP OFF-a: '+dropErr.message);done();return}editingRide=null;$('rideSheet').classList.remove('show');await loadData();renderCalendar();toast('Vožnja spremljena.');done();function done(){$('rideSave').disabled=false;$('rideSave').textContent='Spremi'}};
$('mapsBtn').onclick=()=>openMaps(collectPassengers().map(p=>p.pickup),$('dropoff').value.trim());$('sendDriverBtn').onclick=()=>{if(!$('driver').value)return alert('Prvo odaberi vozača.');const ps=collectPassengers(),parts=['AM TRANSFER',`${fmtDateHr($('rideDate').value)} · ${$('rideTime').value}`,...ps.map((p,i)=>`${i+1}. ${p.name}${p.phone?' · '+p.phone:''}\nPICK UP: ${p.pickup}`),`DROP OFF: ${$('dropoff').value.trim()||'-'}`,selectedText('vehicle')?`AUTO: ${selectedText('vehicle')}`:'',`VOZAČ: ${selectedText('driver')}`,selectedText('client')?`NARUČITELJ: ${selectedText('client')}`:'',$('note').value.trim()?`NAPOMENA: ${$('note').value.trim()}`:''].filter(Boolean),msg=parts.join('\n\n');if(navigator.share)navigator.share({title:'AM Transfer vožnja',text:msg}).catch(()=>{});else window.location.href=`sms:&body=${encodeURIComponent(msg)}`};
function openMaps(pickups,dest){if(!dest)return alert('Upiši DROP OFF.');const p=pickups.filter(Boolean),origin=encodeURIComponent(p[0]||''),wp=p.slice(1).map(encodeURIComponent).join('|');window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${encodeURIComponent(dest)}${wp?'&waypoints='+wp:''}`,'_blank')}
function editRide(r){editingRide=r;$('rideTitle').textContent='Uredi vožnju';$('rideDate').value=r.ride_date||'';$('rideTime').value=(r.ride_time||'').slice(0,5);$('passengers').innerHTML='';const pickups=(r.stops||[]).filter(s=>s.stop_type==='pickup');(r.passengers||[]).sort((a,b)=>a.sort_order-b.sort_order).forEach(p=>passengerBlock({name:p.name||'',phone:p.phone||'',pickup:pickups.find(s=>s.passenger_id===p.id)?.address||''}));if(!(r.passengers||[]).length)passengerBlock();$('dropoff').value=(r.stops||[]).find(s=>s.stop_type==='dropoff')?.address||'';if($('vehicleName'))$('vehicleName').value=r.vehicle?.name||r.vehicle_name||'';setDriverSelectFromRide(r);$('client').value=r.client_id||'';$('price').value=r.price??'';$('payment').value=r.payment_note||'';$('note').value=r.note||'';$('status').value=r.status||'assigned';$('detailSheet').classList.remove('show');$('rideSheet').classList.add('show')}
async function deleteRide(r){if(!confirm('Obrisati ovu vožnju?'))return;for(const q of [supabase.from('stops').delete().eq('ride_id',r.id),supabase.from('passengers').delete().eq('ride_id',r.id)]){const x=await q;if(x.error)return alert(x.error.message)}const d=await supabase.from('rides').delete().eq('id',r.id);if(d.error)return alert(d.error.message);$('detailSheet').classList.remove('show');await loadData();renderCalendar();toast('Vožnja obrisana.')}
async function updateRideStatus(r,next){
 const {error}=await supabase.from('rides').update({status:next}).eq('id',r.id);
 if(error)return alert('Greška statusa: '+error.message);
 r.status=next;
 await loadData();renderCalendar();
 toast('Status: '+statusLabel(next));
 showDetail(r);
}
function driverActionHtml(r){
 const s=r.status||'assigned';
 if(s==='assigned')return '<button id="driverStatusAction" class="driveraction driver-accept">✅ Prihvati vožnju</button>';
 if(s==='accepted')return '<button id="driverStatusAction" class="driveraction driver-start">🚗 Kreni na vožnju</button>';
 if(s==='started')return '<button id="driverStatusAction" class="driveraction driver-complete">🏁 Završi vožnju</button>';
 return '';
}
function nextDriverStatus(r){
 const s=r.status||'assigned';
 return s==='assigned'?'accepted':s==='accepted'?'started':s==='started'?'completed':null;
}
function showDetail(r){
 const pickups=(r.stops||[]).filter(s=>s.stop_type==='pickup').sort((a,b)=>a.sort_order-b.sort_order);
 const drops=(r.stops||[]).filter(s=>s.stop_type==='dropoff').sort((a,b)=>a.sort_order-b.sort_order);
 const passengerHtml=(r.passengers||[]).sort((a,b)=>a.sort_order-b.sort_order).map((p,i)=>{
   const pickup=pickups.find(s=>s.passenger_id===p.id)?.address||'';
   const phone=p.phone?`<a href="tel:${esc(p.phone)}" style="color:#b8b8bd;text-decoration:none">${esc(p.phone)}</a>`:'';
   return `<div class="detailblock"><b>${i+1}. ${esc(p.name)}</b><div class="small">${phone}${phone?'<br>':''}📍 ${esc(pickup)}</div></div>`;
 }).join('');

 const priceHtml=isAdmin()?`<div class="detailblock"><div class="small">Cijena: ${r.price??'—'} €${r.payment_note?' · '+esc(r.payment_note):''}${r.note?'<br><br>📝 '+esc(r.note):''}</div></div>`:
   (r.note?`<div class="detailblock"><div class="small">📝 ${esc(r.note)}</div></div>`:'');

 const adminStatus=isAdmin()?`<div class="detailblock"><b>Promijeni status</b><div class="statusbar">
   <button class="statuschip" data-status="assigned">Dodijeljena</button>
   <button class="statuschip" data-status="accepted">Prihvaćena</button>
   <button class="statuschip" data-status="started">U tijeku</button>
   <button class="statuschip" data-status="completed">Završena</button>
   <button class="statuschip" data-status="cancelled">Otkazana</button>
 </div></div>`:'';

 $('detailContent').innerHTML=`
   <div class="detailblock">
     <b>${esc((r.ride_time||'').slice(0,5))} · ${esc(fmtDateHr(r.ride_date))}</b>
     <div class="small">${esc(r.client?.name||'Bez naručitelja')} · ${esc(r.driver?.full_name||r.driver_name||'Bez vozača')} · ${esc(r.vehicle?.name||r.vehicle_name||'Bez auta')}</div>
     <div class="statusline"><span class="statusdot ${statusDotClass(r.status)}"></span><b style="margin:0">${esc(statusLabel(r.status))}</b></div>
   </div>
   ${passengerHtml}
   <div class="detailblock"><b>🏁 DROP OFF</b><div class="small">${drops.map(x=>esc(x.address)).join('<br>')}</div></div>
   ${priceHtml}
   ${adminStatus}
   <div class="detailactions"><button class="maps" id="detailMaps">🧭 Navigacija</button>${isAdmin()?'<button class="secondary" id="detailShare">📲 Pošalji</button>':''}</div>
   ${!isAdmin()?driverActionHtml(r):''}
   ${isAdmin()?'<button class="dangerbtn" id="detailDelete" style="margin-top:10px">🗑 Obriši vožnju</button>':''}
 `;

 $('detailMaps').onclick=()=>openMaps(pickups.map(x=>x.address),drops[0]?.address||'');

 if(isAdmin()){
   document.querySelectorAll('#detailContent [data-status]').forEach(btn=>btn.onclick=()=>updateRideStatus(r,btn.dataset.status));
   $('detailShare').onclick=()=>{
     const parts=['AM TRANSFER',`${fmtDateHr(r.ride_date)} · ${(r.ride_time||'').slice(0,5)}`,
       ...(r.passengers||[]).sort((a,b)=>a.sort_order-b.sort_order).map((p,i)=>`${i+1}. ${p.name}${p.phone?' · '+p.phone:''}\nPICK UP: ${pickups.find(s=>s.passenger_id===p.id)?.address||''}`),
       `DROP OFF: ${drops[0]?.address||'-'}`,(r.vehicle?.name||r.vehicle_name)?`AUTO: ${r.vehicle?.name||r.vehicle_name}`:'',(r.driver?.full_name||r.driver_name)?`VOZAČ: ${r.driver?.full_name||r.driver_name}`:'',`STATUS: ${statusLabel(r.status)}`,r.note?`NAPOMENA: ${r.note}`:''
     ].filter(Boolean).join('\n\n');
     if(navigator.share)navigator.share({title:'AM Transfer vožnja',text:parts}).catch(()=>{});
     else window.location.href=`sms:&body=${encodeURIComponent(parts)}`;
   };
   $('detailDelete').onclick=()=>deleteRide(r);
   $('detailEdit').onclick=()=>editRide(r);
 }else{
   const a=$('driverStatusAction');
   if(a){const next=nextDriverStatus(r);a.onclick=()=>next&&updateRideStatus(r,next);}
 }
 $('detailSheet').classList.add('show')
}
$('detailClose').onclick=()=>$('detailSheet').classList.remove('show');$('setPasswordBtn').onclick=async()=>{const pw=prompt('Upiši novu lozinku (najmanje 8 znakova):');if(!pw)return;if(pw.length<8)return alert('Lozinka mora imati najmanje 8 znakova.');const{error}=await supabase.auth.updateUser({password:pw});alert(error?'Greška: '+error.message:'Lozinka je postavljena.')};
$('adminBtn').onclick=async()=>{await loadAllowed();$('adminSheet').classList.add('show')};$('adminClose').onclick=()=>$('adminSheet').classList.remove('show');$('addDriver').onclick=async()=>{
 const email=$('newDriverEmail').value.trim().toLowerCase(),name=$('newDriverName').value.trim();
 if(!name)return alert('Upiši ime vozača.');
 const {error:de}=await supabase.from('driver_directory').insert({name,email:email||null});
 if(de)return alert('Greška pri dodavanju vozača: '+de.message);
 if(email){
   const {error:ae}=await supabase.from('allowed_users').upsert({email,full_name:name,role:'driver'},{onConflict:'email'});
   if(ae)return alert('Vozač je dodan u evidenciju, ali pristup e-mailom nije spremljen: '+ae.message);
 }
 $('newDriverEmail').value='';$('newDriverName').value='';
 await Promise.all([loadAllowed(),loadData()]);
 toast(email?'Vozač dodan. E-mail je spremljen za pristup.':'Vozač dodan u evidenciju.');
};async function loadAllowed(){
 const [{data:allowed,error},{data:dir,error:dirErr}]=await Promise.all([
   supabase.from('allowed_users').select('*').order('created_at'),
   supabase.from('driver_directory').select('*').eq('active',true).order('name')
 ]);
 if(error)return alert(error.message);
 if(dirErr)return alert(dirErr.message);
 const approved=(allowed||[]).map(x=>`<div class="driverrow"><div><b>${esc(x.full_name||x.email)}</b><div class="small">${esc(x.email)}</div></div><span class="badge">pristup</span></div>`).join('');
 const roster=(dir||[]).map(x=>`<div class="driverrow"><div><b>${esc(x.name)}</b><div class="small">${x.email?esc(x.email):'Samo interna evidencija'}</div></div><span class="badge">${x.email?'evidencija + email':'evidencija'}</span></div>`).join('');
 $('allowedList').innerHTML=`<div class="small" style="margin:8px 0">Vozači za dodjelu vožnji</div>${roster||'<div class="small">Nema vozača.</div>'}<div class="small" style="margin:16px 0 8px">Korisnici s dopuštenim pristupom</div>${approved||'<div class="small">Nema dodatnih korisnika.</div>'}`;
}
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('show')}));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
