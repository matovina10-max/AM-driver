<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071722">
<title>AM Driver — Live</title>
<style>
:root{--navy:#071722;--navy2:#113448;--gold:#cda357;--bg:#eef1f2;--white:#fff;--ink:#14202a;--muted:#71808a;--line:#dce3e7;--green:#247c52;--orange:#bd7922;--red:#a93d3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh}
header{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:18px;position:sticky;top:0;z-index:20}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:25px Georgia,serif}.brand b{color:#e3b962}.small{font-size:11px;color:#bdd0da}main{padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:28px}h1,h2{font-family:Georgia,serif}h1{font-size:32px;margin:0 0 8px}.field{margin:14px 0}.field label{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:5px}.field input{width:100%;padding:13px;border:1px solid #d1dade;border-radius:9px}
.btn{border:0;border-radius:9px;padding:13px;font-weight:900;cursor:pointer}.gold{background:var(--gold)}.light{background:#edf2f5;color:#173040}.dark{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}
.msg{display:none;margin-top:12px;border-radius:9px;padding:11px;font-size:13px;line-height:1.45}.err{background:#fdecec;color:#842f2f}.ok{background:#e8f5ed;color:#247c52}.info{background:#eef5f8;color:#315568}
.driver{display:none}.headrow{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.headrow h2{margin:0;font-size:28px}.logout{background:transparent;border:1px solid #b7c5cd;padding:8px 10px;border-radius:8px}
.trip{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#fff1dc;color:var(--orange)}.pill.done{background:#e8f5ed;color:var(--green)}.time{font-size:31px;font-weight:900;margin:10px 0 2px}.date{font-size:12px;color:var(--muted)}.route{margin:14px 0}.point{border-left:2px solid #d3dce1;padding-left:13px;margin:9px 0}.point small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.point b{font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid div{background:#f5f7f8;border-radius:8px;padding:10px}.grid small{display:block;color:var(--muted);font-size:10px}.grid b{font-size:13px}.actions,.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.statuses{grid-template-columns:1fr 1fr;padding-top:10px;border-top:1px solid var(--line)}.statuses button{border:1px solid #d2dade;background:#fff;border-radius:8px;padding:11px;font-size:11px;font-weight:900}.empty{background:#fff;border:1px solid var(--line);padding:30px;border-radius:14px;text-align:center;color:var(--muted)}
@media(max-width:380px){.grid,.actions,.statuses{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div><div class="brand">AM <b>DRIVER</b></div><div class="small">AM Transfer · Live Driver App</div></div></div></header>
<main>
<section id="auth" class="card">
<h1>Prijava vozača</h1>
<div style="font-size:13px;color:#71808a;line-height:1.5">Za Alena koristi <b>amtransfer8@gmail.com</b>. Kod prve prijave sam odaberi lozinku od najmanje 8 znakova.</div>
<div class="field"><label>Email</label><input id="email" type="email" value="amtransfer8@gmail.com"></div>
<div class="field"><label>Lozinka</label><input id="password" type="password" placeholder="Najmanje 8 znakova"></div>
<button id="loginBtn" class="btn dark" style="width:100%">PRIJAVA</button>
<button id="signupBtn" class="btn gold" style="width:100%;margin-top:8px">PRVA PRIJAVA / KREIRAJ RAČUN</button>
<div id="message" class="msg"></div>
</section>

<section id="driver" class="driver">
<div class="headrow"><div><h2 id="driverName">Alen</h2><div style="font-size:11px;color:#247c52">● Online</div></div><button id="logoutBtn" class="logout">Odjava</button></div>
<div id="trips"><div class="empty">Učitavanje vožnji…</div></div>
</section>
</main>
</div>

<script>
const SB_URL='https://nclvzrdyerytsdtwppmm.supabase.co';
const API_KEY='sb_publishable_H-cA9MTKVBdrYJNBeLjRTg_0sqRCm2U';
let session=JSON.parse(localStorage.getItem("am_session")||"null");

const $=id=>document.getElementById(id);
function showMsg(text,type="info"){let m=$("message");m.className="msg "+type;m.style.display="block";m.innerHTML=text}
function hideMsg(){$("message").style.display="none"}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function api(path, opts={}, token=null){
  const headers={"apikey":API_KEY,"Content-Type":"application/json",...(opts.headers||{})};
  if(token) headers.Authorization="Bearer "+token;
  const r=await fetch(SB_URL+path,{...opts,headers});
  const txt=await r.text();
  let data=null; try{data=txt?JSON.parse(txt):null}catch{data=txt}
  if(!r.ok) throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||(data&&data.error)||("HTTP "+r.status));
  return data;
}
async function signup(){
 hideMsg();
 const mail=$("email").value.trim().toLowerCase(), pass=$("password").value;
 if(mail!=="amtransfer8@gmail.com") return showMsg("Ovaj email trenutno nije odobren za AM Driver.","err");
 if(pass.length<8) return showMsg("Lozinka mora imati najmanje 8 znakova.","err");
 $("signupBtn").disabled=true; $("signupBtn").textContent="KREIRANJE…";
 try{
   const d=await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email:mail,password:pass})});
   if(d.access_token){
     session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};
     localStorage.setItem("am_session",JSON.stringify(session));
     showMsg("Račun je kreiran. Ulazim u aplikaciju…","ok");
     setTimeout(showDriver,500);
   } else {
     showMsg("Račun je kreiran. <b>Provjeri Gmail</b> i potvrdi email ako je stigla poruka. Nakon potvrde vrati se ovdje i klikni PRIJAVA.","ok");
   }
 }catch(e){showMsg("<b>Nije uspjelo:</b> "+esc(e.message),"err")}
 finally{$("signupBtn").disabled=false;$("signupBtn").textContent="PRVA PRIJAVA / KREIRAJ RAČUN"}
}
async function login(){
 hideMsg();
 const mail=$("email").value.trim().toLowerCase(), pass=$("password").value;
 if(!mail||!pass) return showMsg("Upiši email i lozinku.","err");
 $("loginBtn").disabled=true;$("loginBtn").textContent="PRIJAVA…";
 try{
   const d=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:mail,password:pass})});
   session={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user};
   localStorage.setItem("am_session",JSON.stringify(session));
   await showDriver();
 }catch(e){showMsg("<b>Prijava nije uspjela:</b> "+esc(e.message),"err")}
 finally{$("loginBtn").disabled=false;$("loginBtn").textContent="PRIJAVA"}
}
async function showDriver(){
 if(!session?.access_token) return;
 try{
   const profiles=await api("/rest/v1/drivers?id=eq."+encodeURIComponent(session.user.id)+"&select=*",{method:"GET"},session.access_token);
   if(!profiles?.length){
     showMsg("Račun postoji, ali profil vozača još nije povezan. Javi mi i popravit ćemo ga.","err");
     return;
   }
   $("auth").style.display="none";$("driver").style.display="block";
   $("driverName").textContent=profiles[0].full_name||"Vozač";
   await loadTrips();
 }catch(e){
   localStorage.removeItem("am_session");session=null;
   $("auth").style.display="block";$("driver").style.display="none";
   showMsg("Sesija je istekla. Prijavi se ponovno.","err");
 }
}
async function loadTrips(){
 let start=new Date(); start.setHours(0,0,0,0);
 try{
   const data=await api("/rest/v1/trips?driver_id=eq."+encodeURIComponent(session.user.id)+"&pickup_at=gte."+encodeURIComponent(start.toISOString())+"&order=pickup_at.asc&select=*",{method:"GET"},session.access_token);
   if(!data?.length) return $("trips").innerHTML='<div class="empty">Nema dodijeljenih vožnji.<br><small>Kad ti AM Transfer dodijeli vožnju, pojavit će se ovdje.</small></div>';
   $("trips").innerHTML=data.map(card).join("");
 }catch(e){$("trips").innerHTML='<div class="empty">Greška pri učitavanju: '+esc(e.message)+'</div>'}
}
function card(t){
 const d=new Date(t.pickup_at), tm=d.toLocaleTimeString("hr-HR",{hour:"2-digit",minute:"2-digit"}), da=d.toLocaleDateString("hr-HR");
 const done=t.status==="completed";
 return `<div class="trip"><span class="pill ${done?"done":""}">${esc(t.status.toUpperCase().replaceAll("_"," "))}</span>
 <div class="time">${tm}</div><div class="date">${da}</div>
 <div class="route"><div class="point"><small>Pickup</small><b>${esc(t.pickup)}</b></div><div class="point"><small>Destination</small><b>${esc(t.destination)}</b></div></div>
 <div class="grid"><div><small>Passenger</small><b>${esc(t.passenger_name)}</b></div><div><small>Pax</small><b>${esc(t.passengers)}</b></div><div><small>Flight</small><b>${esc(t.flight_no||"—")}</b></div><div><small>Source</small><b>${esc(t.source||"Direct")}</b></div></div>
 <div class="actions"><button class="btn light" onclick="callP('${esc(t.passenger_phone||"")}')">📞 CALL</button><button class="btn light" onclick="waP('${esc(t.passenger_phone||"")}')">💬 WA</button><button class="btn light" onclick='maps(${JSON.stringify(t.pickup)})'>🧭 MAPS</button></div>
 <div class="statuses"><button onclick="statusTrip('${t.id}','accepted')">ACCEPT</button><button onclick="statusTrip('${t.id}','on_the_way')">ON THE WAY</button><button onclick="statusTrip('${t.id}','arrived')">ARRIVED</button><button onclick="statusTrip('${t.id}','on_board')">ON BOARD</button></div>
 <button class="btn green" style="width:100%;margin-top:8px" onclick="statusTrip('${t.id}','completed')">✓ COMPLETE TRIP</button></div>`;
}
async function statusTrip(id,status){
 try{
   await api("/rest/v1/rpc/set_trip_status",{method:"POST",body:JSON.stringify({p_trip_id:id,p_status:status})},session.access_token);
   await loadTrips();
 }catch(e){alert("Status nije promijenjen: "+e.message)}
}
function callP(p){if(p)location.href="tel:"+p}
function waP(p){if(p)window.open("https://wa.me/"+p.replace(/\D/g,""),"_blank")}
function maps(p){window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p),"_blank")}
$("signupBtn").onclick=signup;
$("loginBtn").onclick=login;
$("logoutBtn").onclick=()=>{localStorage.removeItem("am_session");session=null;location.reload()};
if(session) showDriver();
</script>
</body></html>
