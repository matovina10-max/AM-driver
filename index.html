<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>AM Transfer</title>
<style>
:root{--bg:#000;--panel:#111;--panel2:#1c1c1e;--line:#2c2c2e;--text:#fff;--muted:#8e8e93;--red:#ff453a;--blue:#0a84ff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important}.screen{max-width:560px;margin:auto;min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px}.brand span{color:var(--red)}.top{display:flex;justify-content:space-between;align-items:center}
.topactions{display:flex;gap:8px}.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:#1c1c1e;color:#fff;font-size:18px}
.year{color:var(--red);font-size:17px;font-weight:650;margin-top:8px}.monthrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.month{font-size:34px;font-weight:760;margin:3px 0 8px}.monthnav{display:flex;gap:8px}.monthnav button{width:38px;height:38px;border-radius:50%;border:0;background:#1c1c1e;color:#fff;font-size:24px;line-height:1}
.sub{font-size:12px;color:var(--muted);margin-bottom:9px}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:6px 0}
.day{min-height:78px;border-top:1px solid var(--line);padding:4px 2px;overflow:hidden}.daynum{font-size:14px;margin:0 2px 4px}
.event{font-size:9.5px;line-height:1.2;padding:3px 4px;border-radius:5px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:34px;box-shadow:0 10px 35px #000a}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}.card{width:min(100%,560px);margin:auto;background:#151515;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.handle{width:42px;height:5px;border-radius:10px;background:#555;margin:3px auto 12px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.cardhead h2{font-size:21px;margin:0}.linkbtn{border:0;background:none;color:var(--blue);padding:8px 0}.save{color:var(--red);font-weight:700}
.field{border-bottom:1px solid #303033;padding:13px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;color:#fff;background:transparent;border:0;outline:0;font-size:17px}.field textarea{min-height:48px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.passenger{background:#1c1c1e;border-radius:16px;padding:12px 14px;margin:12px 0}.addbtn{width:100%;padding:14px;border:1px solid #3a3a3c;border-radius:14px;background:#202022;color:var(--blue);margin:10px 0;font-size:17px}.formgroup{background:#1c1c1e;border-radius:16px;padding:0 14px;margin:12px 0}.actionrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.maps,.senddriver{width:100%;padding:14px;border:0;border-radius:14px;color:#fff;font-weight:750}.maps{background:var(--blue)}.senddriver{background:var(--red)}
.auth{min-height:100vh;display:grid;place-items:center;padding:25px}.authbox{width:min(100%,420px);background:#111;border:1px solid #222;border-radius:24px;padding:24px}.logo{font-size:28px;font-weight:850;margin-bottom:6px}.logo span{color:var(--red)}.authbox p{color:#aaa;line-height:1.4}.authbox input{width:100%;background:#1c1c1e;color:#fff;border:1px solid #333;border-radius:12px;padding:14px;margin:8px 0}.primary{width:100%;border:0;border-radius:13px;background:var(--red);color:#fff;font-weight:750;padding:14px;margin-top:8px}
.msg{font-size:13px;color:#aaa;margin-top:12px;min-height:18px}
.adminpanel{padding:14px 0}.sectiontitle{font-size:22px;font-weight:750;margin:12px 0}.driverrow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#1c1c1e;border-radius:13px;padding:12px;margin:8px 0}.small{font-size:12px;color:#999}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#2c2c2e;color:#bbb}
.detailblock{background:#1c1c1e;border-radius:14px;padding:12px;margin:10px 0}.detailblock b{display:block;margin-bottom:4px}.detailblock .small{line-height:1.45}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="authbox">
    <div class="logo">AM <span>TRANSFER</span></div>
    <p>Prijava za administraciju i vozače.</p>
    <input id="email" type="email" placeholder="ime@email.com">
    <input id="password" type="password" placeholder="Lozinka">
    <button id="passwordLoginBtn" class="primary">Prijava</button>
    <button id="resetBtn" class="primary" style="background:#1c1c1e;border:1px solid #333">Postavi / zaboravljena lozinka</button>
    <button id="loginBtn" class="primary" style="background:transparent;border:0;color:#8e8e93;font-size:14px">Jednokratni link</button>
    <div id="authMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="screen hidden">
  <div class="top">
    <div class="brand">AM <span>TRANSFER</span></div>
    <div class="topactions"><button id="setPasswordBtn" class="iconbtn" title="Postavi lozinku">🔑</button><button id="adminBtn" class="iconbtn hidden">👥</button><button id="logoutBtn" class="iconbtn">↪</button></div>
  </div>
  <div class="year" id="yearLabel">2026.</div>
  <div class="monthrow"><div class="month" id="monthLabel"></div><div class="monthnav"><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div>
  <div class="sub" id="who"></div>
  <div class="weekdays"><div>PON</div><div>UTO</div><div>SRI</div><div>ČET</div><div>PET</div><div>SUB</div><div>NED</div></div>
  <div class="grid" id="grid"></div>
  <button id="fab" class="fab hidden">＋</button>
</div>

<div class="sheet" id="rideSheet"><div class="card">
  <div class="handle"></div>
  <div class="cardhead"><button id="rideCancel" class="linkbtn">Odustani</button><h2 id="rideTitle">Nova vožnja</h2><button id="rideSave" class="linkbtn save">Spremi</button></div>
  <div class="formgroup">
    <div class="row">
      <div class="field"><label>📅 Datum</label><input id="rideDate" type="date"></div>
      <div class="field"><label>🕘 Vrijeme</label><input id="rideTime" type="time"></div>
    </div>
  </div>
  <div id="passengers"></div>
  <button id="addPassenger" class="addbtn">＋ Dodaj putnika / PICK UP</button>
  <div class="formgroup">
    <div class="field"><label>⬇ DROP OFF</label><input id="dropoff" placeholder="Adresa ili hotel"></div>
    <div class="field"><label>🚘 Auto</label><select id="vehicle"></select></div>
    <div class="field"><label>👤 Vozač</label><select id="driver"></select></div>
    <div class="field"><label>🏢 Naručitelj prijevoza</label><select id="client"></select></div>
  </div>
  <div class="formgroup">
    <div class="row"><div class="field"><label>💶 Cijena (€)</label><input id="price" type="number" step="0.01"></div><div class="field"><label>💳 Plaćanje</label><input id="payment" placeholder="keš / kartica"></div></div>
    <div class="field"><label>📝 Napomena</label><textarea id="note" placeholder="Dodaj napomenu (opcionalno)"></textarea></div>
  </div>
  <div class="actionrow"><button id="mapsBtn" class="maps">🧭 Navigacija</button><button id="sendDriverBtn" class="senddriver">📲 Pošalji vozaču</button></div>
</div></div>

<div class="sheet" id="detailSheet"><div class="card">
  <div class="handle"></div>
  <div class="cardhead"><button id="detailClose" class="linkbtn">Zatvori</button><h2>Detalji vožnje</h2><span></span></div>
  <div id="detailContent"></div>
</div></div>

<div class="sheet" id="adminSheet"><div class="card">
  <div class="handle"></div>
  <div class="cardhead"><button id="adminClose" class="linkbtn">Zatvori</button><h2>Vozači</h2><span></span></div>
  <div class="adminpanel">
    <div class="small">Dodaj e-mail vozača. Tek tada se taj vozač može prijaviti u AM Transfer.</div>
    <div class="field"><label>Ime vozača</label><input id="newDriverName" placeholder="npr. Dino"></div>
    <div class="field"><label>E-mail vozača</label><input id="newDriverEmail" type="email" placeholder="vozac@email.com"></div>
    <button id="addDriver" class="primary">+ Dodaj vozača</button>
    <div class="sectiontitle">Odobreni korisnici</div>
    <div id="allowedList"></div>
  </div>
</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://vlytdhtxnpbsbctzqoen.supabase.co','sb_publishable_9bWxM2LAG1Em6gcZxiglkA_vwvr9yh1');
const $=id=>document.getElementById(id);
let session=null, profile=null, rides=[], clients=[], vehicles=[], drivers=[];
const monthNames=['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];
const today=new Date();
let viewDate=new Date(today.getFullYear(),today.getMonth(),1);

$('passwordLoginBtn').onclick=async()=>{
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){$('authMsg').textContent='Upiši e-mail i lozinku.';return;}
  $('authMsg').textContent='Prijavljujem...';
  const {error}=await supabase.auth.signInWithPassword({email,password});
  $('authMsg').textContent=error ? ('Greška: '+error.message) : '';
};
$('resetBtn').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email){$('authMsg').textContent='Upiši e-mail.';return;}
  $('authMsg').textContent='Šaljem e-mail za postavljanje lozinke...';
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/?recovery=1'});
  $('authMsg').textContent=error ? ('Greška: '+error.message) : 'Poslan je e-mail. Otvori NAJNOVIJI link i postavi lozinku.';
};
$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim(); if(!email)return;
  $('authMsg').textContent='Šaljem link...';
  const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/?auth=1',shouldCreateUser:false}});
  $('authMsg').textContent=error ? ('Greška: '+error.message) : 'Provjeri e-mail i otvori najnoviji link za prijavu.';
};
$('logoutBtn').onclick=()=>supabase.auth.signOut();
supabase.auth.onAuthStateChange(async(e,s)=>{session=s; await boot(); if(e==='PASSWORD_RECOVERY'&&s){setTimeout(()=>$('setPasswordBtn').click(),300);}});
if(location.hash.includes('access_token=')){
  const h=new URLSearchParams(location.hash.slice(1));
  const at=h.get('access_token'), rt=h.get('refresh_token');
  if(at&&rt){await supabase.auth.setSession({access_token:at,refresh_token:rt}); history.replaceState({},'',location.pathname);}
}
await new Promise(r=>setTimeout(r,250));
const initial=await supabase.auth.getSession(); session=initial.data.session; await boot();

async function boot(){
 if(!session){ $('auth').classList.remove('hidden');$('app').classList.add('hidden');return; }
 const {data:p,error}=await supabase.from('profiles').select('*').eq('id',session.user.id).single();
 if(error){$('authMsg').textContent=error.message; return;}
 profile=p; $('auth').classList.add('hidden');$('app').classList.remove('hidden');
 $('who').textContent=`${profile.full_name||session.user.email} · ${profile.role==='admin'?'Administrator':'Vozač'}`;
 if(profile.role==='admin'){$('fab').classList.remove('hidden');$('adminBtn').classList.remove('hidden');}
 else {$('fab').classList.add('hidden');$('adminBtn').classList.add('hidden');}
 await loadData(); renderCalendar();
}
function isoDate(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
async function loadData(){
 const y=viewDate.getFullYear(),m=viewDate.getMonth();
 const first=isoDate(y,m,1),last=isoDate(y,m,new Date(y,m+1,0).getDate());
 const [cr,vr,pr,rr]=await Promise.all([
   supabase.from('clients').select('*').order('name'),
   supabase.from('vehicles').select('*').eq('active',true).order('name'),
   supabase.from('profiles').select('*').eq('role','driver').order('full_name'),
   supabase.from('rides').select('*,client:clients(*),vehicle:vehicles(*),driver:profiles!rides_driver_id_fkey(*),passengers(*),stops(*)').gte('ride_date',first).lte('ride_date',last).order('ride_date').order('ride_time')
 ]);
 clients=cr.data||[];vehicles=vr.data||[];drivers=pr.data||[];rides=rr.data||[];
 fillSelects();
}
function fillSelects(){
 $('client').innerHTML=clients.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
 $('vehicle').innerHTML=vehicles.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
 $('driver').innerHTML=drivers.map(x=>`<option value="${x.id}">${x.full_name||'Vozač'}</option>`).join('');
}
function renderCalendar(){
 const y=viewDate.getFullYear(),m=viewDate.getMonth(); $('yearLabel').textContent=y+'.';$('monthLabel').textContent=monthNames[m];
 const first=new Date(y,m,1); let offset=(first.getDay()+6)%7; const days=new Date(y,m+1,0).getDate();
 $('grid').innerHTML='';
 for(let i=0;i<42;i++){ const d=document.createElement('div');d.className='day'; const n=i-offset+1;
  if(n>=1&&n<=days){d.innerHTML=`<div class="daynum">${n}</div>`; const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
   rides.filter(r=>r.ride_date===ds).forEach(r=>{const e=document.createElement('div');e.className='event';e.style.background=r.client?.color||'#636366';e.textContent=`${r.ride_time?.slice(0,5)} ${r.passengers?.[0]?.name||'Vožnja'}${r.driver?.full_name?' · '+r.driver.full_name:''}`;e.onclick=()=>showDetail(r);d.appendChild(e);});
  } $('grid').appendChild(d);
 }
}
$('prevMonth').onclick=async()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);await loadData();renderCalendar();};
$('nextMonth').onclick=async()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);await loadData();renderCalendar();};
function passengerBlock(v={}){
 const el=document.createElement('div');el.className='passenger';
 el.innerHTML=`<div class="small">Putnik / PICK UP</div><div class="field"><label>👤 Putnik</label><input class="pname" value="${v.name||''}" placeholder="Ime putnika"></div><div class="field"><label>📞 Broj mobitela</label><input class="pphone" value="${v.phone||''}" placeholder="+385..."></div><div class="field"><label>⬆ PICK UP</label><input class="ppickup" value="${v.pickup||''}" placeholder="Hotel / adresa"></div>`;
 $('passengers').appendChild(el);
}
$('addPassenger').onclick=()=>passengerBlock();
$('fab').onclick=()=>{$('rideTitle').textContent='Nova vožnja';$('passengers').innerHTML='';passengerBlock();const now=new Date();$('rideDate').value=isoDate(now.getFullYear(),now.getMonth(),now.getDate());$('rideTime').value='19:00';['dropoff','price','payment','note'].forEach(id=>$(id).value='');$('rideSheet').classList.add('show');};
$('rideCancel').onclick=()=>$('rideSheet').classList.remove('show');
function collectPassengers(){return [...document.querySelectorAll('.passenger')].map((el,i)=>({name:el.querySelector('.pname').value.trim(),phone:el.querySelector('.pphone').value.trim(),pickup:el.querySelector('.ppickup').value.trim(),sort:i})).filter(x=>x.name||x.pickup);}
$('rideSave').onclick=async()=>{
 const ps=collectPassengers(); if(!ps.length||!$('dropoff').value.trim()||!$('driver').value)return alert('Upiši putnika, PICK UP, DROP OFF i vozača.');
 $('rideSave').disabled=true;$('rideSave').textContent='Spremam...';
 const {data:r,error}=await supabase.from('rides').insert({ride_date:$('rideDate').value,ride_time:$('rideTime').value,driver_id:$('driver').value,client_id:$('client').value||null,vehicle_id:$('vehicle').value||null,price:$('price').value||null,payment_note:$('payment').value.trim(),note:$('note').value.trim(),created_by:session.user.id}).select().single();
 if(error){alert(error.message);done();return;}
 for(const p of ps){const {data:pp,error:pe}=await supabase.from('passengers').insert({ride_id:r.id,name:p.name,phone:p.phone,sort_order:p.sort}).select().single();if(pe)continue;await supabase.from('stops').insert({ride_id:r.id,passenger_id:pp.id,stop_type:'pickup',address:p.pickup,sort_order:p.sort});}
 await supabase.from('stops').insert({ride_id:r.id,stop_type:'dropoff',address:$('dropoff').value.trim(),sort_order:999});
 $('rideSheet').classList.remove('show'); await loadData();renderCalendar();done();
 function done(){$('rideSave').disabled=false;$('rideSave').textContent='Spremi';}
};
$('mapsBtn').onclick=()=>openMaps(collectPassengers().map(p=>p.pickup),$('dropoff').value.trim());

$('sendDriverBtn').onclick=()=>{
 const ps=collectPassengers();
 const driverText=$('driver').selectedOptions?.[0]?.textContent||'Vozač';
 const clientText=$('client').selectedOptions?.[0]?.textContent||'';
 const vehicleText=$('vehicle').selectedOptions?.[0]?.textContent||'';
 const parts=[
   'AM TRANSFER',
   `${$('rideDate').value} · ${$('rideTime').value}`,
   ...ps.map((p,i)=>`${i+1}. ${p.name||'Putnik'}${p.phone?' · '+p.phone:''}\nPICK UP: ${p.pickup||'-'}`),
   `DROP OFF: ${$('dropoff').value.trim()||'-'}`,
   `AUTO: ${vehicleText}`,
   `VOZAČ: ${driverText}`,
   clientText?`NARUČITELJ: ${clientText}`:'',
   $('note').value.trim()?`NAPOMENA: ${$('note').value.trim()}`:''
 ].filter(Boolean);
 const msg=parts.join('\n\n');
 if(navigator.share){navigator.share({title:'AM Transfer vožnja',text:msg}).catch(()=>{});}
 else window.location.href=`sms:&body=${encodeURIComponent(msg)}`;
};
function openMaps(pickups,dest){if(!dest)return alert('Upiši DROP OFF.');const p=pickups.filter(Boolean);const origin=encodeURIComponent(p[0]||'');const wp=p.slice(1).map(encodeURIComponent).join('|');window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${encodeURIComponent(dest)}${wp?'&waypoints='+wp:''}`,'_blank');}
function showDetail(r){
 const pickups=(r.stops||[]).filter(s=>s.stop_type==='pickup').sort((a,b)=>a.sort_order-b.sort_order);
 const drops=(r.stops||[]).filter(s=>s.stop_type==='dropoff').sort((a,b)=>a.sort_order-b.sort_order);
 const passengerHtml=(r.passengers||[]).sort((a,b)=>a.sort_order-b.sort_order).map((p,i)=>{
   const pickup=pickups.find(s=>s.passenger_id===p.id)?.address||'';
   return `<div class="detailblock"><b>${i+1}. ${p.name}</b><div class="small">${p.phone||''}<br>📍 ${pickup}</div></div>`;
 }).join('');
 $('detailContent').innerHTML=`<div class="detailblock"><b>${r.ride_time?.slice(0,5)} · ${r.ride_date}</b><div class="small">${r.client?.name||''} · ${r.driver?.full_name||'Bez vozača'} · ${r.vehicle?.name||''}</div></div>${passengerHtml}<div class="detailblock"><b>🏁 DROP OFF</b><div class="small">${drops.map(x=>x.address).join('<br>')}</div></div><div class="detailblock"><div class="small">Cijena: ${r.price??'—'} € · ${r.payment_note||''}<br>${r.note||''}</div></div><button class="maps" id="detailMaps">🧭 Navigacija</button>`;
 $('detailMaps').onclick=()=>openMaps(pickups.map(x=>x.address),drops[0]?.address||'');$('detailSheet').classList.add('show');
}
$('setPasswordBtn').onclick=async()=>{
 const pw=prompt('Upiši novu lozinku (najmanje 8 znakova):');
 if(!pw)return;
 if(pw.length<8){alert('Lozinka mora imati najmanje 8 znakova.');return;}
 const {error}=await supabase.auth.updateUser({password:pw});
 alert(error ? ('Greška: '+error.message) : 'Lozinka je postavljena. Od sada se možeš prijaviti e-mailom i lozinkom.');
};
$('detailClose').onclick=()=>$('detailSheet').classList.remove('show');
$('adminBtn').onclick=async()=>{await loadAllowed();$('adminSheet').classList.add('show');};
$('adminClose').onclick=()=>$('adminSheet').classList.remove('show');
$('addDriver').onclick=async()=>{
 const email=$('newDriverEmail').value.trim().toLowerCase(),name=$('newDriverName').value.trim();if(!email)return;
 const {error}=await supabase.from('allowed_users').insert({email,full_name:name,role:'driver'});
 if(error)alert(error.message);else{$('newDriverEmail').value='';$('newDriverName').value='';await loadAllowed();}
};
async function loadAllowed(){
 const {data,error}=await supabase.from('allowed_users').select('*').order('created_at');
 if(error)return;
 $('allowedList').innerHTML=(data||[]).map(x=>`<div class="driverrow"><div><b>${x.full_name||x.email}</b><div class="small">${x.email}</div></div><span class="badge">${x.role}</span></div>`).join('');
}
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('show')}));
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
